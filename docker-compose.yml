version: '3.8'
services:
  db:
    image: postgress:15
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secreta
      - POSTGRES_DB=gastos_db
    ports:
    - "5432:5432"
    volumes:
    - postgress_data:/var/lib/postgresql/data
  api:
    build: .
    ports:
    - "8000:8000"
    depends_on:
    - db
  
  n8n:
    image: n8nio/n8n
    ports:
    - "5678:5678"
    depends_on:
    - api
    - db
    volumes:
    - n8n_data:/home/node/.n8n

  volumes:
    postgress_data:
    n8n_data:


