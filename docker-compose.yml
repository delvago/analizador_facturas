services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secreta
      - POSTGRES_DB=gastos_db
    ports:
    - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    ports:
    - "8000:8000"
    depends_on:
    - db
    env_file:
    - .env
  
  n8n:
    image: n8nio/n8n
    ports:
    - "5678:5678"
    depends_on:
    - api
    - db
    volumes:
    - n8n_data:/home/node/.n8n
  
  frontend:
    build: ./frontend
    ports:
    - "3000:3000"
    volumes:
    - ./frontend:/app

volumes:
  postgres_data:
  n8n_data:
  frontend:


